services:
  - type: web
    name: ventas-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_EMAIL
        value: kalefcgonzaleshl2@gmail.com
      - key: AUTH_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ventas-db
          property: connectionString

databases:
  - name: ventas-db
    plan: free
